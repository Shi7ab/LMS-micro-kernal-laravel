version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lms_postgres
    restart: always
    environment:
      POSTGRES_DB: lms_kernel
      POSTGRES_USER: kernel_root
      POSTGRES_PASSWORD: secret_db_password
    ports:
      - "5432:5432"
    volumes:
      - lms_db_data:/var/lib/postgresql/data

volumes:
  lms_db_data:
